<!DOCTYPE html>
<html lang="ms" class="h-full w-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heat Transfer Process - MOHDSAIFULPAHRUDIN</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Halang pemilihan teks dan seretan */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    /* Corak latar belakang moden & gelap */
    .bg-dark-grid {
      background-color: #0f172a;
      background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
    }

    /* Animasi toast amaran */
    @keyframes slideDownFade {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-toast {
      animation: slideDownFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="h-full w-full flex flex-col justify-between bg-dark-grid text-slate-100 relative overflow-hidden select-none">

  <!-- Toast Notifikasi Perlindungan Hak Cipta -->
  <div id="securityToast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden max-w-sm w-[90%] bg-slate-900/95 border border-rose-500/60 backdrop-blur-xl text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs transition-all pointer-events-none">
    <div class="w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center shrink-0">
      <i class="fa-solid fa-shield-halved text-base"></i>
    </div>
    <div class="flex-1">
      <p class="font-bold text-rose-300 uppercase tracking-wider text-[11px]">Kandungan Dilindungi</p>
      <p class="text-[11px] text-slate-300 leading-tight">Hak cipta terpelihara &copy; MOHDSAIFULPAHRUDIN</p>
    </div>
  </div>

  <!-- Bahagian Atas: Butang Navigasi Home & Tajuk Ringkas -->
  <header class="w-full px-5 py-4 flex items-center justify-between z-30 shrink-0 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md">
    <!-- Butang Home ke index.html -->
    <a href="index.html" 
       class="inline-flex items-center space-x-2.5 px-4 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 hover:text-white font-medium text-xs sm:text-sm border border-slate-700/80 shadow-md hover:shadow-indigo-500/10 transition-all duration-200 active:scale-95">
      <i class="fa-solid fa-house text-indigo-400"></i>
      <span>Home</span>
    </a>

    <!-- Tajuk Tengah / Sub-info -->
    <div class="flex items-center space-x-2">
      <span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        <i class="fa-solid fa-fire mr-1.5 text-amber-400"></i> Heat Transfer Process
      </span>
    </div>

    <!-- Butang Paparan Skrin Penuh -->
    <button id="fullscreenToggleBtn" 
            title="Skrin Penuh"
            class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/80 transition-all active:scale-95">
      <i id="fullscreenIcon" class="fa-solid fa-expand text-xs"></i>
    </button>
  </header>

  <!-- Bahagian Utama: Video Google Drive Terbenam (Responsif 16:9) -->
  <main class="flex-1 w-full flex items-center justify-center p-3 sm:p-6 overflow-hidden">
    <div id="videoContainer" class="relative w-full max-w-5xl aspect-video max-h-[calc(100vh-7.5rem)] rounded-2xl overflow-hidden bg-black shadow-2xl shadow-indigo-950/40 border border-slate-800 ring-1 ring-white/10 flex items-center justify-center">
      
      <!-- Video Google Drive Menggunakan Pautan /preview untuk Embed Terus -->
      <iframe 
        id="driveVideoPlayer"
        src="https://drive.google.com/file/d/1rs-v31-496Rv2lmSQPkjH-NfabE2P1Mi/preview" 
        class="w-full h-full border-0 absolute inset-0"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>

    </div>
  </main>

  <!-- Bahagian Bawah: Hak Cipta & Maklumat Footer -->
  <footer class="w-full py-2.5 px-4 text-center text-[11px] text-slate-500 border-t border-slate-800/60 bg-slate-900/40">
    <p>Hak Cipta Terpelihara &copy; MOHDSAIFULPAHRUDIN</p>
  </footer>

  <script>
    // Logik Skrin Penuh (Fullscreen)
    const fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
    const fullscreenIcon = document.getElementById('fullscreenIcon');

    fullscreenToggleBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenIcon.className = "fa-solid fa-compress text-xs";
        }).catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            fullscreenIcon.className = "fa-solid fa-expand text-xs";
          }).catch(() => {});
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenIcon.className = "fa-solid fa-expand text-xs";
      } else {
        fullscreenIcon.className = "fa-solid fa-compress text-xs";
      }
    });

    // Paparan Notifikasi Amaran Keselamatan (Toast)
    let toastTimer;
    function showSecurityToast() {
      const toast = document.getElementById('securityToast');
      toast.classList.remove('hidden');
      toast.classList.add('animate-toast');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('animate-toast');
      }, 2500);
    }

    // 1. Menghalang Klik Kanan (Anti-Right Click)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      showSecurityToast();
      return false;
    });

    // 2. Menghalang Tindakan Seret (Drag)
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    });

    // 3. Menghalang Pintasan Kekunci DevTools & Simpanan Fail
    document.addEventListener('keydown', function(e) {
      // F12 (DevTools)
      if (e.keyCode === 123) {
        e.preventDefault();
        showSecurityToast();
        return false;
      }
      // Ctrl+Shift+I / J / C (Inspect Element)
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) {
        e.preventDefault();
        showSecurityToast();
        return false;
      }
      // Ctrl+U (View Source), Ctrl+S (Save), Ctrl+P (Print)
      if ((e.ctrlKey || e.metaKey) && ['u','U','s','S','p','P'].includes(e.key)) {
        e.preventDefault();
        showSecurityToast();
        return false;
      }
    });
  </script>
</body>
</html>
